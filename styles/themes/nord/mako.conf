# Theme - Nord Frost

font=Maple Mono NF 10
background-color=#3b4252F2
text-color=#eceff4
width=350
height=110
margin=14
padding=12
border-size=1
border-color=#88c0d0
border-radius=6
icons=1
max-icon-size=48
default-timeout=5000
ignore-timeout=0
group-by=summary
progress-color=#88c0d0FF

[urgency=low]
border-color=#434c5e
default-timeout=3000

[urgency=normal]
border-color=#88c0d0
default-timeout=5000

[urgency=critical]
border-color=#bf616a
text-color=#FFFFFF
default-timeout=0
