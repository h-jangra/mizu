# Theme - Dracula

font=Maple Mono NF 10
background-color=#21222cF2
text-color=#f8f8f2
width=350
height=110
margin=14
padding=12
border-size=1
border-color=#bd93f9
border-radius=6
icons=1
max-icon-size=48
default-timeout=5000
ignore-timeout=0
group-by=summary
progress-color=#bd93f9FF

[urgency=low]
border-color=#44475a
default-timeout=3000

[urgency=normal]
border-color=#bd93f9
default-timeout=5000

[urgency=critical]
border-color=#ff5555
text-color=#FFFFFF
default-timeout=0
