# Theme - Frosted Neumorphic

font=Maple Mono NF 10
background-color=#ffffffF2
text-color=#1e293b
width=350
height=110
margin=14
padding=12
border-size=1
border-color=#4361ee
border-radius=6
icons=1
max-icon-size=48
default-timeout=5000
ignore-timeout=0
group-by=summary
progress-color=#4361eeFF

[urgency=low]
border-color=#ffffff
default-timeout=3000

[urgency=normal]
border-color=#4361ee
default-timeout=5000

[urgency=critical]
border-color=#ef4444
text-color=#FFFFFF
default-timeout=0
