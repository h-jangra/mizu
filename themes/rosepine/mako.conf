# Theme - Rosé Pine

font=Maple Mono NF 10
background-color=#1f1d2eF2
text-color=#e0def4
width=350
height=110
margin=14
padding=12
border-size=1
border-color=#c4a7e7
border-radius=6
icons=1
max-icon-size=48
default-timeout=5000
ignore-timeout=0
group-by=summary
progress-color=#c4a7e7FF

[urgency=low]
border-color=#26233a
default-timeout=3000

[urgency=normal]
border-color=#c4a7e7
default-timeout=5000

[urgency=critical]
border-color=#eb6f92
text-color=#FFFFFF
default-timeout=0
