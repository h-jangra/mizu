# Theme - Catppuccin Mocha

font=Maple Mono NF 10
background-color=#313244F2
text-color=#cdd6f4
width=350
height=110
margin=14
padding=12
border-size=1
border-color=#cba6f7
border-radius=6
icons=1
max-icon-size=48
default-timeout=5000
ignore-timeout=0
group-by=summary
progress-color=#cba6f7FF

[urgency=low]
border-color=#45475a
default-timeout=3000

[urgency=normal]
border-color=#cba6f7
default-timeout=5000

[urgency=critical]
border-color=#f38ba8
text-color=#FFFFFF
default-timeout=0
